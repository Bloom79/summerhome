name: Analizza — analisi live di una casa

# The detail sheet's "Analisi live" button files an "Analizza:" issue via
# the Cloudflare Worker; this runs the live analysis within a minute and
# posts the report as the issue comment the portal polls for.

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  models: read

jobs:
  analizza:
    if: startsWith(github.event.issue.title, 'Analizza:')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run live analysis
        id: run
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/analizza-live.mjs

      - name: Verdetto agente via Copilot CLI
        if: ${{ hashFiles('analisi-prompt.txt') != '' }}
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.G_COPILOT }}
        run: |
          npm install -g @github/copilot >/dev/null 2>&1 || true
          copilot -p "$(cat analisi-prompt.txt)" > verdetto-raw.txt 2>copilot-err.txt || true
          sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' verdetto-raw.txt > verdetto.txt || true
          echo "--- copilot stderr (primi 400 char):"; head -c 400 copilot-err.txt || true
          node - <<'EOF'
          const fs = require('fs')
          let rep = fs.readFileSync('analisi-report.md', 'utf8')
          let v = ''
          try { v = fs.readFileSync('verdetto.txt', 'utf8').trim() } catch {}
          const ok = v && v.length > 80 && !/not authorized|authentication|login|error/i.test(v.slice(0, 120))
          rep = rep.replace('<!--VERDETTO_QUI-->', ok
            ? "### 🧠 Valutazione ragionata dell'agente (Copilot)\n" + v
            : '_Valutazione LLM non disponibile in questo run — sopra trovi comunque tutti gli indicatori calcolati._')
          fs.writeFileSync('analisi-report.md', rep)
          console.log('verdetto Copilot:', ok ? 'inserito' : 'non disponibile')
          EOF

      - name: Post report and close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' >> analisi-report.md
          gh issue comment ${{ github.event.issue.number }} --repo "$GITHUB_REPOSITORY" --body-file analisi-report.md
          gh issue close ${{ github.event.issue.number }} --repo "$GITHUB_REPOSITORY"
