name: Analizza — analisi live di una casa

# The detail sheet's "Analisi live" button files an "Analizza:" issue via
# the Cloudflare Worker; this runs the live analysis within a minute and
# posts the report as the issue comment the portal polls for.

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  models: read

jobs:
  analizza:
    if: startsWith(github.event.issue.title, 'Analizza:')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run live analysis
        id: run
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/analizza-live.mjs

      - name: Post report and close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' >> analisi-report.md
          gh issue comment ${{ github.event.issue.number }} --repo "$GITHUB_REPOSITORY" --body-file analisi-report.md
          gh issue close ${{ github.event.issue.number }} --repo "$GITHUB_REPOSITORY"
