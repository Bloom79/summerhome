name: Weekly source audit

# Every Sunday, shortly after the daily refresh, re-check every published
# listing against its live source page (price, address, coords, still on
# the market). Individual mismatches self-heal at the next refresh; the
# audit exists to catch systematic adapter breakage and surface it as an
# issue instead of silently rotting data.

on:
  schedule:
    - cron: '30 7 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit listings against sources
        id: audit
        run: node scripts/audit-sources.mjs

      - name: Surface findings as an issue
        if: failure() || steps.audit.outputs.status == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="$(cat audit-report.md 2>/dev/null || echo 'Audit fallito prima di produrre il report — vedi log.')

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🔍 Audit sorgenti $(date -u +%F): ${{ steps.audit.outputs.summary || 'fallito' }}" \
            --body "$BODY" || true
