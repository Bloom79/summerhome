name: IT sources probe (temporary)

# Runs the Abruzzo pipeline once from a GitHub runner to check the sources
# answer datacenter IPs. No commit, no deploy. Remove before merging.

on:
  push:
    branches: [feature/more-sources]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Subito reachability
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36'
          for u in \
            'https://hades.subito.it/v1/search/items?c=6&t=s&r=13&ci=1&to=066065&lim=5' \
            'https://www.subito.it/' \
            'https://www.subito.it/annunci-abruzzo/vendita/immobili/l-aquila/ovindoli/' \
            'https://www.subito.it/appartamenti/meraviglioso-appartamento-in-villa-l-aquila-661870530.htm'; do
            curl -s -o /tmp/p -w "%{http_code} %{size_download} $u\n" --compressed --max-time 25 -A "$UA" -H 'Accept-Language: it-IT,it;q=0.9' "$u"
            head -c 300 /tmp/p | tr '\n' ' '; echo
          done
      - name: Refresh (dry run, data not committed)
        run: node scripts/it/refresh.mjs
      - name: Quality gate
        run: node scripts/it/validate.mjs
      - name: Report
        if: always()
        run: cat it-refresh-report.md || true
