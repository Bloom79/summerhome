name: IT hunter probe (temporary)

# Runs the deal hunter once from a GitHub runner with the repo's Copilot
# token, to check Claude reviews the shortlist. No commit, no deploy.
# Remove before merging.

on:
  push:
    branches: [feature/hunter]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Hunter with Claude via Copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.G_COPILOT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @github/copilot >/dev/null 2>&1 || true
          node scripts/it/hunter.mjs
      - name: Report
        if: always()
        run: |
          cat hunter-report.md || true
          node -e 'const h=require("./public/it/hunter.json");console.log(h.model,JSON.stringify(h.stats));for(const p of h.picks)console.log(p.ai?p.ai.verdict:"-",p.score,JSON.stringify(p.ai&&p.ai.fair),p.url)'
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunter
          path: public/it/hunter.json
