name: Cerca qui — risposta immediata

# Runs the moment a "Cerca qui:" issue lands (filed by the map button via the
# Cloudflare Worker). Scrapes the requested area with scripts/cerca-qui.mjs,
# pushes the new zone and triggers the Pages deploy: houses live in minutes.
# On any failure the issue stays open and the daily agent handles it at 06:00.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: cerca-qui

jobs:
  handle:
    if: startsWith(github.event.issue.title, 'Cerca qui:')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Process the request
        id: proc
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/cerca-qui.mjs

      - name: Install dependencies
        if: steps.proc.outputs.status == 'ok'
        run: npm ci

      - name: Build
        if: steps.proc.outputs.status == 'ok'
        run: npm run build

      - name: Commit and push
        if: steps.proc.outputs.status == 'ok'
        run: |
          git config user.name 'casatrova-agent'
          git config user.email 'noreply@github.com'
          git add src/data.js docs/extra-zones.json
          git commit -m "Cerca qui: ${{ steps.proc.outputs.zone }} (+${{ steps.proc.outputs.added }} case)"
          git pull --rebase origin main
          git push origin main

      - name: Trigger Pages deploy
        if: steps.proc.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY"

      - name: Close issue — homes added
        if: steps.proc.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close ${{ github.event.issue.number }} --repo "$GITHUB_REPOSITORY" --comment "🤖 Fatto! Zona **${{ steps.proc.outputs.zone }}** aggiunta al portale con **${{ steps.proc.outputs.added }} case**. Tra un paio di minuti le vedi su https://bloom79.github.io/summerhome/ (ricarica la pagina). L'agente giornaliero terrà la zona aggiornata da qui in poi.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"

      - name: Close issue — nothing for sale
        if: steps.proc.outputs.status == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close ${{ github.event.issue.number }} --repo "$GITHUB_REPOSITORY" --comment "🤖 Ho controllato subito: ${{ steps.proc.outputs.msg }}. Nessuna zona aggiunta — riprova dal bottone della mappa quando vuoi.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"

      - name: Leave to the daily agent on failure
        if: failure() || steps.proc.outputs.status == 'error'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo "$GITHUB_REPOSITORY" --body "🤖 Non sono riuscito a gestire subito la richiesta (${{ steps.proc.outputs.msg || 'errore imprevisto' }}): resta in coda e se ne occupa l'agente giornaliero alle 06:00 UTC.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
