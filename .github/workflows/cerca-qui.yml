name: Cerca qui — risposta immediata

# Runs the moment a "Cerca qui:" issue lands (filed by the map button via the
# Cloudflare Worker). Scrapes the requested area, quality-gates the data,
# publishes, and closes the issue. Listings live in public/data.json (fetched
# by the app at runtime), so when the built bundle is unchanged the cached
# dist is reused and no npm install/build runs at all.
# On any failure the issue stays open and the daily agent handles it at 06:00.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: cerca-qui

jobs:
  handle:
    # Author gate: only the owner's issues trigger runs (see analizza.yml).
    if: startsWith(github.event.issue.title, 'Cerca qui:') && github.event.issue.user.login == 'Bloom79'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Process the request
        id: proc
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/cerca-qui.mjs

      - name: Quality gate
        if: steps.proc.outputs.status == 'ok'
        run: node scripts/validate-data.mjs --spot-check 3

      - name: Restore built site
        if: steps.proc.outputs.status == 'ok'
        id: distcache
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: dist-${{ hashFiles('package-lock.json', 'src/**', 'index.html', 'vite.config.js') }}

      - name: Setup Node
        if: steps.proc.outputs.status == 'ok' && steps.distcache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build (bundle changed since last deploy)
        if: steps.proc.outputs.status == 'ok' && steps.distcache.outputs.cache-hit != 'true'
        run: npm ci && npm run build

      - name: Refresh data in the site
        if: steps.proc.outputs.status == 'ok'
        run: cp public/data.json dist/data.json

      - name: Commit and push
        if: steps.proc.outputs.status == 'ok'
        run: |
          git config user.name 'casatrova-agent'
          git config user.email 'noreply@github.com'
          git add public/data.json docs/extra-zones.json
          git commit -m "Cerca qui: ${{ steps.proc.outputs.zone }} (+${{ steps.proc.outputs.added }} case)"
          git pull --rebase origin main
          git push origin main

      # Closed before the Pages deploy: the portal hot-swaps the fresh
      # data.json straight from raw.githubusercontent as soon as it's pushed.
      - name: Close issue — homes added
        if: steps.proc.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close ${{ github.event.issue.number }} --repo "$GITHUB_REPOSITORY" --comment "🤖 Fatto! Zona **${{ steps.proc.outputs.zone }}** aggiunta al portale con **${{ steps.proc.outputs.added }} case**. Le vedi su https://bloom79.github.io/summerhome/ — se hai il portale aperto compaiono da sole.

          Controllo qualità: ${{ steps.proc.outputs.msg }}. L'agente giornaliero terrà la zona aggiornata da qui in poi.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"

      - name: Setup Pages
        if: steps.proc.outputs.status == 'ok'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: steps.proc.outputs.status == 'ok'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.proc.outputs.status == 'ok'
        uses: actions/deploy-pages@v4

      # Wake the alert notifier: it diffs data.json and pushes to subscribers.
      - name: Notify alert subscribers
        if: steps.proc.outputs.status == 'ok'
        run: curl -sf -X POST https://casatrova-cerca-qui.casatrova.workers.dev/check || true

      - name: Close issue — nothing for sale
        if: steps.proc.outputs.status == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close ${{ github.event.issue.number }} --repo "$GITHUB_REPOSITORY" --comment "🤖 Ho controllato subito: ${{ steps.proc.outputs.msg }}. Nessuna zona aggiunta — riprova dal bottone della mappa quando vuoi.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"

      - name: Leave to the daily agent on failure
        if: failure() || steps.proc.outputs.status == 'error'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo "$GITHUB_REPOSITORY" --body "🤖 Non sono riuscito a gestire subito la richiesta (${{ steps.proc.outputs.msg || 'errore imprevisto' }}): resta in coda e se ne occupa l'agente giornaliero alle 06:00 UTC.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
