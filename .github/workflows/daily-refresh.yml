name: Daily listings refresh

# Deterministic daily refresh (05:45 UTC): re-scrape every zone, diff, verify
# vanished listings, publish. Replaces the scraping half of the Claude routine,
# which now supervises: it checks this ran, handles leftovers and sends the
# morning report. Any failure here opens/updates a visible issue.

on:
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: cerca-qui

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 200 # trends.mjs reads the daily snapshots of data.json

      - name: Refresh listings
        id: refresh
        run: node scripts/daily-refresh.mjs

      - name: Quality gate
        if: steps.refresh.outputs.status == 'changed'
        run: node scripts/validate-data.mjs --spot-check 3

      - name: Analyze deals
        if: steps.refresh.outputs.status == 'changed'
        id: deals
        run: node scripts/analyze-deals.mjs

      - name: Market trends
        if: steps.refresh.outputs.status == 'changed'
        run: node scripts/trends.mjs || true

      - name: Restore built site
        if: steps.refresh.outputs.status == 'changed'
        id: distcache
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: dist-${{ hashFiles('package-lock.json', 'src/**', 'index.html', 'vite.config.js') }}

      - name: Setup Node
        if: steps.refresh.outputs.status == 'changed' && steps.distcache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build (bundle changed since last deploy)
        if: steps.refresh.outputs.status == 'changed' && steps.distcache.outputs.cache-hit != 'true'
        run: npm ci && npm run build

      - name: Refresh data in the site
        if: steps.refresh.outputs.status == 'changed'
        run: cp public/data.json dist/data.json && cp public/deals.json dist/deals.json && cp public/trends.json dist/trends.json 2>/dev/null || true

      - name: Commit and push
        if: steps.refresh.outputs.status == 'changed'
        run: |
          git config user.name 'casatrova-agent'
          git config user.email 'noreply@github.com'
          git add public/data.json public/deals.json public/trends.json
          git commit -m "Daily listings refresh $(date -u +%F): ${{ steps.refresh.outputs.summary }} · ${{ steps.deals.outputs.summary }}" -m "$(cat refresh-report.md)" -m "$(cat deals-report.md 2>/dev/null || true)"
          git pull --rebase origin main
          git push origin main

      - name: Setup Pages
        if: steps.refresh.outputs.status == 'changed'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: steps.refresh.outputs.status == 'changed'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.refresh.outputs.status == 'changed'
        uses: actions/deploy-pages@v4

      - name: Notify alert subscribers
        if: steps.refresh.outputs.status == 'changed'
        run: curl -sf -X POST https://casatrova-cerca-qui.casatrova.workers.dev/check || true

      - name: Surface failure as an issue
        if: failure() || steps.refresh.outputs.status == 'error'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "⚠️ Daily refresh fallito $(date -u +%F)" \
            --body "Il refresh quotidiano non è andato a buon fine (${{ steps.refresh.outputs.summary || 'vedi log' }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          L'agente notturno farà da fallback al prossimo giro.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_" || true
