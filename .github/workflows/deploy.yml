name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; skip runs queued in between.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same gate the cerca-qui workflow runs: bad data never goes live —
      # a failed check keeps the previously deployed site untouched.
      - name: Quality gate
        run: node scripts/validate-data.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Shared with the cerca-qui workflow: when only data changed, it reuses
      # this dist and skips npm install/build entirely.
      - name: Cache built site
        uses: actions/cache/save@v4
        with:
          path: dist
          key: dist-${{ hashFiles('package-lock.json', 'src/**', 'index.html', 'vite.config.js') }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Wake the alert notifier: it diffs data.json and pushes to subscribers.
      - name: Notify alert subscribers
        run: curl -sf -X POST https://casatrova-cerca-qui.casatrova.workers.dev/check || true
