plugins {
    id 'com.android.application'
}

// Release signing comes from android/keystore.properties (never committed):
//   storeFile=/abs/path/casatrova-release.jks
//   storePassword=…
//   keyAlias=casatrova
//   keyPassword=…
// Keep the same keystore for every release, or Android refuses the update
// and the app must be uninstalled first.
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'io.github.bloom79.casatrova'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.bloom79.casatrova'
        minSdk 24
        // 34, not 35: Android 15 forces edge-to-edge on apps targeting 35,
        // which would draw the site under the status bar.
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
